<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet" th:href="@{/font-awesome/css/font-awesome.css}">
    <link href="../../../static/css/animate.css" rel="stylesheet" th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
    <link href="../../../static/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
    <link href="../../../static/css/plugins/dataTables/datatables.min.css" rel="stylesheet" th:href="@{/css/plugins/dataTables/datatables.min.css}">
    <link href="../../../static/css/plugins/datapicker/datepicker3.css" rel="stylesheet" th:href="@{/css/plugins/datapicker/datepicker3.css}">
</head>
<body class="fixed-nav">
<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">
            <div class="ibox">
                <div class="ibox-content">
                    <form th:action="@{/audit-logs}" method="get" th:object="${auditFilter}">
                        <div class="row">
                            <div class="col-sm-3">
                                <div class="form-group">
                                    <label>User</label>
                                    <input type="text" class="form-control" th:field="*{userName}">
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="form-group">
                                    <label>Action</label>
                                    <input type="text" class="form-control" th:field="*{action}">
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="form-group">
                                    <label>Entity</label>
                                    <input type="text" class="form-control" th:field="*{tableName}">
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="form-group">
                                    <label>Record ID</label>
                                    <input type="text" class="form-control" th:field="*{recordId}">
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <label>Keyword</label>
                                    <input type="text" class="form-control" th:field="*{keyword}">
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="form-group">
                                    <label>Start Date</label>
                                    <div class="input-group">
                                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                                        <input id="auditStartDate" type="text" class="form-control" th:field="*{startDate}">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="form-group">
                                    <label>End Date</label>
                                    <div class="input-group">
                                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                                        <input id="auditEndDate" type="text" class="form-control" th:field="*{endDate}">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-2">
                                <div class="form-group" style="padding-top: 24px;">
                                    <button class="btn btn-primary" type="submit"><i class="fa fa-search"></i> Filter</button>
                                </div>
                            </div>
                        </div>
                    </form>
                    <div class="btn-group m-b-md">
                        <a class="btn btn-white"
                           th:href="@{/audit-logs/download(userName=${auditFilter.userName}, action=${auditFilter.action}, tableName=${auditFilter.tableName}, recordId=${auditFilter.recordId}, keyword=${auditFilter.keyword}, startDate=${auditFilter.startDate != null ? #dates.format(auditFilter.startDate, 'dd/MM/yyyy') : null}, endDate=${auditFilter.endDate != null ? #dates.format(auditFilter.endDate, 'dd/MM/yyyy') : null})}">
                            <i class="fa fa-download"></i> Download CSV
                        </a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered table-hover auditLogsTable nowrap">
                            <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Entity</th>
                                <th>Record ID</th>
                                <th>Result</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${auditRows}">
                                <td th:text="${row.auditLog.timestamp != null ? #dates.format(row.auditLog.timestamp, 'dd MMM yyyy HH:mm:ss') : '-'}">01 Jan 2026 08:00:00</td>
                                <td th:text="${row.auditLog.userName}">User</td>
                                <td th:text="${row.auditLog.action}">saveAccount</td>
                                <td th:text="${row.auditLog.table}">Account</td>
                                <td th:text="${row.auditLog.recordId}">1</td>
                                <td>
                                    <div th:text="${row.friendlyResult}">Updated Account | ID 10</div>
                                    <details class="m-t-xs text-muted">
                                        <summary>Details</summary>
                                        <pre style="white-space: pre-wrap; min-width: 320px;" th:text="${row.auditLog.result}">payload</pre>
                                    </details>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="fragments/template :: footer"></div>
    </div>
</div>

<script src="../../../static/js/jquery-3.6.0.min.js" th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js" th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js" th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js" th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/plugins/datapicker/bootstrap-datepicker.js" th:src="@{/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
<script src="../../../static/js/plugins/dataTables/datatables.min.js" th:src="@{/js/plugins/dataTables/datatables.min.js}"></script>
<script src="../../../static/js/inspinia.js" th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js" th:src="@{/js/plugins/pace/pace.min.js}"></script>
<script>
    $(document).ready(function () {
        $('.auditLogsTable').DataTable({
            pageLength: 25,
            responsive: true,
            scrollX: true,
            order: [ [0, 'desc'] ]
        });

        $('#auditStartDate, #auditEndDate').datepicker({
            format: 'dd/mm/yyyy',
            autoclose: true
        });
    });
</script>
</body>
</html>
