<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet" th:href="@{/font-awesome/css/font-awesome.css}">
    <link href="../../../static/css/animate.css" rel="stylesheet" th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
    <link href="/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="fixed-nav">
<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>Departments</h5>
                            <div class="ibox-tools">
                                <a th:if="${canManageDepartments}" data-toggle="modal" data-target="#addDepartmentModal">
                                    <button class="btn btn-success btn-sm" title="Add Department" type="button">
                                        <i class="fa fa-plus-square"></i>
                                    </button>
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Head Of Department</th>
                                        <th th:if="${canManageDepartments}">Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="department : ${departments}">
                                        <td th:text="${department.name}"></td>
                                        <td>
                                            <a th:if="${department.manager > 0 and managerNames[department.manager] != null}"
                                               class="entity-link"
                                               th:href="@{/accounts/view-account/{id}(id=${department.manager})}"
                                               th:text="${managerNames[department.manager]}"></a>
                                            <span th:if="${department.manager <= 0 or managerNames[department.manager] == null}" class="text-muted">Not assigned</span>
                                        </td>
                                        <td th:if="${canManageDepartments}">
                                            <a data-toggle="modal" th:data-target="'#editDepartmentModal' + ${department.id}">
                                                <button class="btn btn-success btn-sm" title="Edit" type="button">
                                                    <i class="fa fa-pencil-square" aria-hidden="true"></i>
                                                </button>
                                            </a>
                                            <a data-toggle="modal" th:data-target="'#deleteDepartmentModal' + ${department.id}">
                                                <button class="btn btn-danger btn-sm" title="Delete" type="button">
                                                    <i class="fa fa-trash" aria-hidden="true"></i>
                                                </button>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(departments)}">
                                        <td th:colspan="${canManageDepartments ? 3 : 2}">No departments found.</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="fragments/template :: footer"></div>
    </div>
</div>

<div class="modal fade" id="addDepartmentModal" tabindex="-1" role="dialog" aria-hidden="true" th:if="${canManageDepartments}">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Department</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form th:action="@{/departments/save-department}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Head Of Department</label>
                        <select name="managerId" class="form-control">
                            <option value="">-- Select Manager --</option>
                            <option th:each="manager : ${managers}" th:value="${manager.id}" th:text="${manager.fullName}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-warning" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:each="department : ${departments}" th:if="${canManageDepartments}">
    <div class="modal fade" th:id="'editDepartmentModal' + ${department.id}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Department</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{/departments/update-department}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="id" th:value="${department.id}">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" class="form-control" th:value="${department.name}" required>
                        </div>
                        <div class="form-group">
                            <label>Head Of Department</label>
                            <select name="managerId" class="form-control">
                                <option value="">-- Select Manager --</option>
                                <option th:each="manager : ${managers}"
                                        th:value="${manager.id}"
                                        th:text="${manager.fullName}"
                                        th:selected="${department.manager > 0 and manager.id == department.manager}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-warning" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" th:id="'deleteDepartmentModal' + ${department.id}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Department</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{/departments/delete-department}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="id" th:value="${department.id}">
                        <p class="text-danger">Delete this department?</p>
                        <p th:text="${department.name}"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-warning" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="../../../static/js/jquery-3.6.0.min.js" th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js" th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js" th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js" th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/inspinia.js" th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js" th:src="@{/js/plugins/pace/pace.min.js}"></script>
</body>
</html>
