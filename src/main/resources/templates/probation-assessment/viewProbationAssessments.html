<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Management</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet" th:href="@{/font-awesome/css/font-awesome.css}">
    <link href="../../../static/css/animate.css" rel="stylesheet" th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
    <link href="/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="fixed-nav">
<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>
    <div id="page-wrapper" class="gray-bg">
        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">
            <div class="ibox-content m-b-sm border-bottom">
                <div class="form-group row">
                    <div class="col-lg-12 text-right" th:if="${canManageProbation}">
                        <a th:href="@{/probation-assessments/config}" class="btn btn-primary">Configure</a>
                        <a th:href="@{/probation-assessments/add-contract}" class="btn btn-success">New Contract</a>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Employee</th>
                            <th>Performance Period</th>
                            <th>Status</th>
                            <th>Current Step</th>
                            <th>Result</th>
                            <th>Date</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="assessment, stat : ${assessments}">
                            <td th:text="${stat.count}"></td>
                            <td>
                                <a th:if="${assessment.employee != null}"
                                   class="entity-link"
                                   th:href="@{/accounts/view-account/{id}(id=${assessment.employee.id})}"
                                   th:text="${assessment.employee.fullName}"></a>
                            </td>
                            <td th:text="${#strings.isEmpty(assessment.performancePeriod) ? (assessment.startDate + ' - ' + assessment.endDate) : assessment.performancePeriod}"></td>
                            <td th:text="${assessment.status}"></td>
                            <td th:text="${assessment.currentStepName}"></td>
                            <td th:with="result=${resultsByAssessmentId[assessment.id]}">
                                <div th:text="${result.performanceBand}"></div>
                                <small th:text="${#numbers.formatDecimal(result.resultMark, 1, 2) + ' / 5 (' + result.resultSource + ')'}"></small>
                            </td>
                            <td th:text="${assessment.date}"></td>
                            <td>
                                <a th:href="@{/probation-assessments/view-assessment/{id}(id=${assessment.id})}" class="btn btn-xs btn-primary">Open</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(assessments)}">
                            <td colspan="8">No probation assessments found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:replace="fragments/template :: footer"></div>
    </div>
</div>

<script src="../../../static/js/jquery-3.6.0.min.js" th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js" th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js" th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js" th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/inspinia.js" th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js" th:src="@{/js/plugins/pace/pace.min.js}"></script>
</body>
</html>
