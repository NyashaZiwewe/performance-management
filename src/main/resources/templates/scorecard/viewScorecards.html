<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>.:: Performance Management ::.</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet"
          th:href="@{/font-awesome/css/font-awesome.css}">

    <link href="../../../static/css/animate.css" rel="stylesheet"
          th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet"
          th:href="@{/css/style.css}">
    <link href="/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">

    <link href="../../../static/css/plugins/select2/select2.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2.min.css}">
    <link href="../../../static/css/plugins/select2/select2-bootstrap4.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2-bootstrap4.min.css}">
    <link href="../../../static/css/plugins/dataTables/datatables.min.css" rel="stylesheet"
          th:href="@{/css/plugins/dataTables/datatables.min.css}">

</head>

<body class="fixed-nav">

<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>

    <div id="page-wrapper" class="gray-bg">

        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">

            <div class="row">
                <div class="col-lg-12 ">
                    <div class="ibox ">
                        <div class="ibox-title">
                            <h5>Scorecards</h5>
                            <div class="ibox-tools">
                                <a th:href="@{/scorecards/add-scorecard}" class="btn btn-success btn-sm">Add New Scorecard</a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <form th:action="@{/scorecards}" method="get" class="m-b-md">
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="reportingPeriodId">Reporting Period</label>
                                            <select id="reportingPeriodId" name="reportingPeriodId" class="select2_demo_1 form-control">
                                                <option th:each="period : ${reportingPeriodsList}"
                                                        th:value="${period.id}"
                                                        th:text="${period.startDate + ' - ' + period.endDate}"
                                                        th:selected="${selectedReportingPeriodId != null and selectedReportingPeriodId == period.id}">
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="ownerName">Owner Name</label>
                                            <input id="ownerName" name="ownerName" type="text" class="form-control"
                                                   th:value="${ownerName}" placeholder="Search by owner name">
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="approvalStatus">Approval Status</label>
                                            <select id="approvalStatus" name="approvalStatus" class="select2_demo_1 form-control">
                                                <option value="" th:selected="${approvalStatus == null or approvalStatus == ''}">All</option>
                                                <option value="NEW" th:selected="${approvalStatus == 'NEW'}">NEW</option>
                                                <option value="PENDING_APPROVAL" th:selected="${approvalStatus == 'PENDING_APPROVAL'}">PENDING_APPROVAL</option>
                                                <option value="APPROVED_BY_SUPERVISOR" th:selected="${approvalStatus == 'APPROVED_BY_SUPERVISOR'}">APPROVED_BY_SUPERVISOR</option>
                                                <option value="REJECTED_BY_SUPERVISOR" th:selected="${approvalStatus == 'REJECTED_BY_SUPERVISOR'}">REJECTED_BY_SUPERVISOR</option>
                                                <option value="APPROVED_BY_HR" th:selected="${approvalStatus == 'APPROVED_BY_HR'}">APPROVED_BY_HR</option>
                                                <option value="REJECTED_BY_HR" th:selected="${approvalStatus == 'REJECTED_BY_HR'}">REJECTED_BY_HR</option>
                                                <option value="SCORED_BY_EMPLOYEE" th:selected="${approvalStatus == 'SCORED_BY_EMPLOYEE'}">SCORED_BY_EMPLOYEE</option>
                                                <option value="SCORED_BY_SUPERVISOR" th:selected="${approvalStatus == 'SCORED_BY_SUPERVISOR'}">SCORED_BY_SUPERVISOR</option>
                                                <option value="AGREED_BY_TWO" th:selected="${approvalStatus == 'AGREED_BY_TWO'}">AGREED_BY_TWO</option>
                                                <option value="MODERATED_BY_HR" th:selected="${approvalStatus == 'MODERATED_BY_HR'}">MODERATED_BY_HR</option>
                                                <option value="CLOSED" th:selected="${approvalStatus == 'CLOSED'}">CLOSED</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <button type="submit" class="btn btn-primary btn-sm">Apply Search</button>
                                    <a th:href="@{/scorecards}" class="btn btn-white btn-sm">Reset</a>
                                </div>
                            </form>
                            <fieldset class="p2">
                                <legend class="w-auto">Scorecards Information</legend>
                                <div class="table-responsive" th:fragement="administration">
                                <table class="table table-striped table-bordered table-hover transactionsDataTable nowrap">
                                    <thead>
                                    <tr>
                                        <th>Owner</th>
                                        <th>Reporting Period</th>
                                        <th>Model</th>
                                        <th>Status</th>
                                        <th>Lock Status</th>
                                        <th>Approval Status</th>
                                        <th>Last Updated</th>
                                        <th>Date Created</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="scorecard :${scorecards}">
                                        <td th:text="${scorecard.owner?.fullName}"></td>
                                        <td th:text="${scorecard.reportingPeriod?.startDate} +' - '+ ${scorecard.reportingPeriod?.endDate}"></td>
                                        <td th:text="${scorecard.scorecardModel?.name}"></td>
                                        <td>
                                            <div th:switch="${scorecard.status}">
                                                <label class="label label-primary" th:case="ACTIVE" th:text="${scorecard.status}"></label>
                                                <label class="label label-danger" th:case="IN_ACTIVE" th:text="${scorecard.status}"></label>
                                                <label class="label label-danger" th:case="*">UNKNOWN STATUS</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div th:switch="${scorecard.lockStatus}">
                                                <label class="label label-primary" th:case="OPEN" th:text="${scorecard.lockStatus}"></label>
                                                <label class="label label-danger" th:case="LOCKED" th:text="${scorecard.lockStatus}"></label>
                                                <label class="label label-danger" th:case="*">UNKNOWN STATUS</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div th:switch="${scorecard.approvalStatus}">
                                                <label class="label label-primary" th:case="NEW" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-warning" th:case="PENDING_APPROVAL" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-success" th:case="APPROVED_BY_SUPERVISOR" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-danger" th:case="REJECTED_BY_SUPERVISOR" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-success" th:case="APPROVED_BY_HR" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-danger" th:case="REJECTED_BY_HR" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-success" th:case="SCORED_BY_EMPLOYEE" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-success" th:case="SCORED_BY_SUPERVISOR" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-success" th:case="AGREED_BY_TWO" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-success" th:case="MODERATED_BY_HR" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-secondary " th:case="CLOSED" th:text="${scorecard.approvalStatus}"></label>
                                                <label class="label label-danger" th:case="*">UNKNOWN STATUS</label>
                                            </div>
                                        </td>
                                        <td th:text="${scorecard.lastUpdate}"></td>
                                        <td th:text="${scorecard.date}"></td>
                                        <td th:with="
                                                isOwner=${loggedUserId == scorecard.owner.id},
                                                isSupervisor=${scorecard.owner != null and scorecard.owner.supervisor != null and loggedUserId == scorecard.owner.supervisor.id},
                                                isModerator=${role == 'MODERATOR'},
                                                canCaptureScores=${scorecard.status == 'ACTIVE' and (
                                                    (isOwner and scorecard.approvalStatus == 'APPROVED_BY_HR') or
                                                    (isSupervisor and (scorecard.approvalStatus == 'SCORED_BY_EMPLOYEE' or scorecard.approvalStatus == 'SCORED_BY_SUPERVISOR')) or
                                                    (isModerator and scorecard.approvalStatus == 'AGREED_BY_TWO')
                                                )},
                                                canEditTargets=${scorecard.status == 'ACTIVE' and (isOwner or loggedUser.special == 'HAS_SPECIAL_RIGHTS')
                                                    and scorecard.lockStatus == 'OPEN'
                                                    and (scorecard.approvalStatus == 'NEW' or scorecard.approvalStatus == 'REJECTED_BY_SUPERVISOR')}
                                            ">
                                            <span class="d-inline-block m-b-xs">
                                                <a th:if="${canCaptureScores}"
                                                   th:href="@{/scorecards/capture-scores/{id}(id=${scorecard.id})}"
                                                   class="btn btn-success btn-sm m-r-xs">Capture Scores</a>
                                                <a th:if="${canEditTargets}"
                                                   th:href="@{/scorecards/capture-targets/{id}(id=${scorecard.id})}"
                                                   class="btn btn-success btn-sm m-r-xs">Edit Targets</a>
                                            </span>
                                            <a th:href="@{/scorecards/clone-scorecard/{id}(id=${scorecard.id})}"
                                               class="btn btn-success btn-sm m-r-xs m-b-xs">Clone Scorecard</a>
                                            <a th:href="@{/scorecards/view-scorecard/{id}(id=${scorecard.id})}"
                                               class="btn btn-primary btn-sm m-r-xs m-b-xs">View Scorecard</a>
                                            <a th:if="${scorecard.approvalStatus == 'MODERATED_BY_HR'}" th:href="@{/performance-review/download-pdf/{id}(id=${scorecard.id})}" class="btn btn-success btn-sm" type="button">View Report</a>
                                        </td>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="fragments/template :: footer"></div>

    </div>
</div>


<!-- Mainly scripts -->
<script src="../../../static/js/jquery-3.6.0.min.js"
        th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js"
        th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js"
        th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js"
        th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/plugins/select2/select2.full.min.js"
        th:src="@{/js/plugins/select2/select2.full.min.js}"></script>

<!-- Custom and plugin javascript -->
<script src="../../../static/js/inspinia.js"
        th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js"
        th:src="@{/js/plugins/pace/pace.min.js}"></script>
<script src="../../../static/js/plugins/dataTables/datatables.min.js"
        th:src="@{/js/plugins/dataTables/datatables.min.js}"></script>


<script>

    $.fn.dataTable.Buttons.defaults.dom.button.className = 'btn btn-white btn-sm';

    $(document).ready(function(){
        $('.transactionsDataTable').DataTable({
            pageLength: 25,
            responsive: true,
            scrollX: true,
            dom: '<"html5buttons"B>lTfgitp',
            buttons: [
                { extend: 'copy'},
                {extend: 'csv',
                    title: 'Scorecards',
                    exportOptions: {
                        columns: [0,1,2,3,4,5,6,7]
                    }},
                {extend: 'excel',
                    title: 'Scorecards',
                    exportOptions: {
                        columns: [0,1,2,3,4,5,6,7]
                    }},
                {extend: 'pdf',
                    title: 'Scorecards',
                    exportOptions: {
                        columns: [0,1,2,3,4,5,6,7]
                    }},

                {extend: 'print',
                    title: 'Scorecards',
                    exportOptions: {
                        columns: [0,1,2,3,4,5,6,7]
                    },
                    customize: function (win){
                        $(win.document.body).addClass('white-bg');
                        $(win.document.body).css('font-size', '10px');

                        $(win.document.body).find('table')
                            .addClass('compact')
                            .css('font-size', 'inherit');
                    }
                }
            ]

        });

    });

    $(document).ready(function () {
        $('.select2_demo_1').select2({});
    })

</script>

</body>

</html>
