<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Performance Management</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet"
          th:href="@{/font-awesome/css/font-awesome.css}">

    <link href="../../../static/css/animate.css" rel="stylesheet"
          th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet"
          th:href="@{/css/style.css}">
    <link href="/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
    <link href="../../../static/css/plugins/select2/select2.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2.min.css}">
    <link href="../../../static/css/plugins/select2/select2-bootstrap4.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2-bootstrap4.min.css}">

    <script>
        function setButtonLoadingState(button, loadingText) {
            if (!button) {
                return;
            }
            button.disabled = true;
            if (button.tagName === 'BUTTON') {
                if (!button.dataset.originalHtml) {
                    button.dataset.originalHtml = button.innerHTML;
                }
                button.innerHTML = '<i class="fa fa-spinner fa-spin"></i> ' + loadingText;
            } else if (button.tagName === 'INPUT') {
                if (!button.dataset.originalValue) {
                    button.dataset.originalValue = button.value;
                }
                button.value = loadingText;
            }
        }

        function lockSubmittingForm(form, loadingText) {
            if (!form) {
                return false;
            }
            if (form.dataset.submitting === 'true') {
                return true;
            }
            form.dataset.submitting = 'true';
            var submitButtons = form.querySelectorAll('button[type="submit"], input[type="submit"]');
            submitButtons.forEach(function (button) {
                setButtonLoadingState(button, loadingText || 'Saving...');
            });
            return false;
        }

        function submitScorecardForApproval(){
            var form = document.getElementById('scorecardForm');
            if (lockSubmittingForm(form, 'Submitting...')) {
                return;
            }
            var actionButtons = document.querySelectorAll('.submit-scorecard-btn');
            actionButtons.forEach(function (button) {
                setButtonLoadingState(button, 'Submitting...');
            });
            form.submit();
        }
    </script>
    <style>
        .show{
            display: block;
        }
        .hide{
            display: none;
        }
    </style>
</head>

<body class="fixed-nav">

<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>

    <div id="page-wrapper" class="gray-bg">

        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">
            <div class="ibox-content m-b-sm border-bottom">
                <form th:action="@{/scorecards/select-gear}" method="post">
                    <div class="row">
                        <div class="col-4">
                            <label>Select <span th:text="${stage1}"></span></label>
                        </div>
                        <div class="col-4">
                            <select class="form-control select2_demo_1" name="gearId">
                                <option th:each="gear: ${remainingGears}" th:value="${gear.id}" th:text="${gear.name}"></option>
                            </select>
                        </div>
                        <div class="col-4">
                            <input type="hidden" name="scorecardId" th:value="${scorecard.id}">
                            <button type="submit" class="btn btn-success btn-sm">Include <span th:text="${stage1}"></span> in contract</button>
                        </div>
                    </div>
                </form>

                <div class="row table-responsive" th:each="gear, gstat : ${selectedGears}">
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <td th:if="${model =='gear'}" colspan="5" style="font-weight: bold"><span th:text="${stage1}"></span> : <span th:text="${gear.name}"></span></td>
                            <td th:if="${model =='programme'}" colspan="7" style="font-weight: bold"><span th:text="${stage1}"></span> : <span th:text="${gear.name}"></span></td>
                            <td>Total <span th:text="${stage1}"></span> Weight: </td>
                            <td><h4 th:text="${gear.totalAllocatedWeight} + '%'"></h4></td>
                            <td></td>
                        </tr>
                        <tr th:if="${gstat.index == 0}">
                            <th th:if="${model =='gear'}"><span th:text="${stage4}"></span></th>
                            <th th:if="${model =='programme'}"><span th:text="${stage2}"></span></th>
                            <th th:if="${model =='programme'}"><span th:text="${stage3}"></span></th>
                            <th th:if="${model =='programme'}"><span th:text="${stage4}"></span></th>
                            <th>Output</th>
                            <th data-toggle="popover" data-placement="top" data-content="Represents evidence of success and failure">Performance Indicator</th>
                            <th data-toggle="popover" data-placement="top" data-content="Unit of measurement can be in currency, number or percentage">Unit</th>
                            <th data-toggle="popover" data-placement="top" data-content="Baseline target">Base Target</th>
                            <th data-toggle="popover" data-placement="top" data-content="Target">Target</th>
                            <th data-toggle="popover" data-placement="top" data-content="Allocated Goal Weight">Weight</th>
                            <th style="width: 70px !important;"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:unless="${#lists.isEmpty(gear.targetsList)}" th:each="target, stat :  ${gear.targetsList}" th:with="newOutcome=${(stat.index == 0) || (gear.targetsList[stat.index - 1].outcome.id != target?.outcome.id)}, newOutput=${newOutcome || (stat.index == 0) ||  (gear.targetsList[stat.index - 1].output != target?.output)}">

                            <td th:if="${newOutcome && model=='gear'}" th:text="${target?.outcome?.name}" th:rowspan="${gear.targetsList.?[outcome == #root.target?.outcome].size()}"></td>
                            <td th:if="${newOutcome && model=='programme'}" th:text="${target.outcome.pillar.goal.name}" th:rowspan="${gear.targetsList.?[outcome == #root.target?.outcome].size()}"></td>
                            <td th:if="${newOutcome && model=='programme'}" th:text="${target.outcome.pillar.name}" th:rowspan="${gear.targetsList.?[outcome == #root.target?.outcome].size()}"></td>
                            <td th:if="${newOutcome && model=='programme'}" th:text="${target?.outcome?.name}" th:rowspan="${gear.targetsList.?[outcome == #root.target?.outcome].size()}"></td>
                            <td th:if="${newOutput}" th:text="${target?.output?.name}" th:rowspan="${gear.targetsList.?[output == #root.target?.output].size()}"></td>
                            <td th:text="${target.measure}"></td>
                            <td th:text="${target.unit}"></td>
                            <td>
                                <a th:if="${#strings.contains(target.baseTarget,'E')}" th:text="${T(java.lang.String).format('%.2f', target.baseTarget)}"></a>
                                <a th:unless="${#strings.contains(target.baseTarget,'E')}" th:text="${target.baseTarget}"></a>
                            </td>
                            <td>
                                <a th:if="${#strings.contains(target.normalTarget,'E')}" th:text="${T(java.lang.String).format('%.2f', target.normalTarget)}"></a>
                                <a th:unless="${#strings.contains(target.normalTarget,'E')}" th:text="${target.normalTarget}"></a>
                            </td>
                            <td th:if="${newOutput}" th:rowspan="${gear.targetsList.?[output == #root.target?.output].size()}" style="vertical-align: middle; text-align: center;">
                                <a th:text="${target.output.allocatedWeight == null ? '' : #numbers.formatDecimal(target.output.allocatedWeight, 0,  2)}"></a>
                            </td>
                            <td style="width: 70px !important;">
                                <a data-toggle="modal" th:data-target="'#addModal'+ ${target.id}"><i class="fa fa-lg fa-plus" style="color: #175ea8"></i></a>
                                <a data-toggle="modal" th:data-target="'#editModal'+ ${target.id}"><i class="fa fa-lg fa-pencil-square" style="color: rebeccapurple"></i></a>
                                <a data-toggle="modal" th:data-target="'#deleteModal'+ ${target.id}"><i class="fa fa-lg fa-trash" style="color: red"></i></a>
                            </td>

                            <div class="modal fade" th:id="'editModal'+ ${target.id}" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog modal-lg" role="document">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h4 class="modal-title">Update Target [<span th:text="${target.goal?.name}" class="text-success"></span>]</h4>
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>
                                        <form method="post" th:object="${target}" th:action="@{/scorecards/save-output-target}">
                                            <div class="modal-body">
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4"><span th:text="${stage1}"></span></label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <select name="gearId" class="form-control select2_demo_1" style="width: 100%">
                                                                        <option th:value="${target.gear?.id}" th:text="${target.gear?.name}" selected></option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4"><span th:text="${stage2}"></span></label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <select name="goalId" class="form-control select2_demo_1" style="width: 100%">
                                                                        <option th:value="${target.goal?.id}" th:text="${target.goal?.name}" selected></option>
                                                                        <option th:each="goal :${gear.goals}" th:value="${goal.id}" th:text="${goal.name}"></option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4"><span th:text="${stage4}"></span></label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <select name="outcomeId" class="form-control select2_demo_1" style="width: 100%">
                                                                        <option th:value="${target.outcome?.id}" th:text="${target.outcome?.name}" selected></option>
                                                                        <th:block th:if="${model == 'gear'}" th:each="goal : ${gear.goals}">
                                                                            <option th:each="outcome :${goal.outcomes}" th:value="${outcome.id}" th:text="${outcome.name}"></option>
                                                                        </th:block>
                                                                        <th:block th:if="${model == 'programme'}" th:each="goal : ${gear.goals}">
                                                                            <th:block th:each="pillar : ${goal.pillars}">
                                                                                <option th:each="outcome :${pillar.outcomes}" th:value="${outcome.id}" th:text="${outcome.name}"></option>
                                                                            </th:block>
                                                                        </th:block>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Output</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="text" name="name" class="form-control" th:value="${target.output?.name}" style="width: 100%" required>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Performance Indicator</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="text" name="measure" class="form-control" th:value="${target.measure}" required>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Unit of Measurement</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <select name="unit" class="form-control myselect" required>
                                                                        <option th:value="${target.unit}" th:text="${target.unit}" selected></option>
                                                                        <option th:each="unit :${unitsList}" th:text="${unit}" th:value="${unit}"></option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Base Target</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="number" step="any" name="baseTarget" class="form-control" th:value="${target.baseTarget}" required>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Target</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="number" step="any" name="normalTarget" class="form-control" th:value="${target.normalTarget}" required>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Allocated Weight</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="number" step="any" min="0.1" max="100" name="allocatedWeight" class="form-control" th:value="${target.output.allocatedWeight}" required>
                                                                    <input type="hidden" th:value="${target.id}" name="targetId">
                                                                    <input type="hidden" th:value="${target.output.id}" name="outputId">
                                                                    <input type="hidden" th:value="${scorecard.id}" name="scorecardId">
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                                <button type="submit" class="btn btn-primary">Save changes</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <div class="modal fade" th:id="'addModal'+ ${target.id}" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog modal-lg" role="document">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h4 class="modal-title">Add Another Target to Output [<span th:text="${target.output?.name}" class="text-success"></span>]</h4>
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>
                                        <form method="post" th:object="${target}" th:action="@{/scorecards/save-target-to-existing-output}">
                                            <div class="modal-body">
                                                <div class="row">
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Output</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <select name="output" class="form-control select2_demo_1" style="width: 100%" required>
                                                                        <option th:value="${target.output?.id}" th:text="${target.output?.name}" selected></option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Performance Indicator</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="text" name="measure" class="form-control" required>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Unit of Measurement</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <select name="unit" class="form-control myselect" required>
                                                                        <option th:value="${target.unit}" th:text="${target.unit}" selected></option>
                                                                        <option th:each="unit :${unitsList}" th:text="${unit}" th:value="${unit}"></option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Base Target</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="number" step="any" name="baseTarget" class="form-control" required>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Target</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="number" step="any" name="normalTarget" class="form-control" required>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-12">
                                                        <div class="form-group row">
                                                            <label class="col-form-label col-lg-4">Allocated Weight</label>
                                                            <div class="col-lg-8">
                                                                <div class="input-group m-b">
                                                                    <input type="number" step="any" min="0.1" max="100" name="allocatedWeight" th:value="${target.output.allocatedWeight}" class="form-control" required>
                                                                    <input type="hidden" th:value="${scorecard.id}" name="scorecardId">
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                                <button type="submit" class="btn btn-primary">Save New Measure</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <div class="modal fade" th:id="'deleteModal'+ ${target.id}" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog" role="document">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Delete Target</h5>
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>
                                        <form method="post" th:object="${target}" th:action="@{/scorecards/delete-target}">
                                            <div class="modal-body">
                                                <div class="row">
                                                    <div class="col-12">
                                                        <h5 class="text-danger">Are you sure you want to delete this Output/Target?</h5>
                                                    </div>
                                                    <div class="col-12">
                                                        <h3 th:text="${target.measure}"></h3>
                                                    </div>
                                                    <input type="hidden" th:value="${target.id}" name="id">
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-waring" data-dismiss="modal">Cancel</button>
                                                <button type="submit" class="btn btn-danger">Yes Delete</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </tr>

                        <form th:if="${totalAllocatedWeight != 100.0}" th:action="@{/scorecards/save-output-target}" method="post" th:object="${output}">
                            <tr>
                                <td colspan="3">
                                    <select class="form-control select2_demo_1" name="outcomeId" required>
                                        <th:block th:if="${model == 'gear'}" th:each="goal : ${gear.goals}">
                                            <option th:each="outcome : ${goal.outcomes}" th:value="${outcome.id}" th:text="${outcome.name}"></option>
                                        </th:block>
                                        <th:block th:if="${model == 'programme'}" th:each="goal : ${gear.goals}">
                                            <th:block th:each="pillar : ${goal.pillars}">
                                                <option th:each="outcome : ${pillar.outcomes}" th:value="${outcome.id}" th:text="${outcome.name}"></option>
                                            </th:block>
                                        </th:block>
                                    </select>
                                </td>
                                <td>
                                    <textarea class="form-control" name="name" rows="1" required></textarea>
                                </td>
                                <td>
                                    <textarea class="form-control" name="measure" rows="1" required></textarea>
                                </td>
                                <td>
                                    <select class="form-control myselect" name="unit">
                                        <option value="" selected></option>
                                        <option th:each="unit :${unitsList}" th:text="${unit}" th:value="${unit}"></option>
                                    </select>
                                </td>
                                <td>
                                    <input type="number" step="any" class="form-control" name="baseTarget" required>
                                </td>
                                <td>
                                    <input type="number" step="any" class="form-control" name="normalTarget" required>
                                </td>
                                <td>
                                    <input type="number" step="any" min="0.1" max="100" style="width: 6em" class="form-control" name="allocatedWeight" required>
                                </td>
                                <td>
                                    <input type="hidden" name="scorecardId" th:value="${id}">
                                    <button class="btn btn-sm btn-success" type="submit">Save</button>
                                </td>
                            </tr>
                        </form>
                        <tr th:if="${gstat.last}">
                            <td th:if="${model =='gear'}" colspan="8"></td>
                            <td th:if="${model =='programme'}" colspan="10"></td>
                        </tr>
                        <tr th:if="${gstat.last}">
                            <td th:if="${model =='gear'}" colspan="4"></td>
                            <td th:if="${model =='programme'}" colspan="6"></td>
                            <td colspan="2" style="text-align: right"><b>Total Allocated Weight:</b></td>
                            <td>
                                <h4 th:if="${totalAllocatedWeight == 100.0}" class="text-green" th:text="${totalAllocatedWeight} + '%'"></h4>
                                <h4 th:unless="${totalAllocatedWeight == 100.0}" class="text-danger" th:text="${totalAllocatedWeight} + '%'"></h4>
                            </td>
                            <td></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="form-group row">
                    <div class="col-lg-4">
                        <input type="hidden" name="scorecardId" th:value="${id}">
                    </div>
                    <div class="col-lg-8" th:if="${totalAllocatedWeight == 100.0}">
                        <a th:href="@{/scorecards}" class="btn btn-success" type="button">Save For Later</a>
                        <button class="btn btn-success submit-scorecard-btn" th:if="${scorecard.approvalStatus == scorecardWorkflow.newStatus}" type="button" onclick="submitScorecardForApproval()"
                                th:text="${approvalStatusActionLabels != null and scorecard.approvalStatus != null and approvalStatusActionLabels[#strings.toUpperCase(scorecard.approvalStatus)] != null ? approvalStatusActionLabels[#strings.toUpperCase(scorecard.approvalStatus)] : 'Submit for Approval'}">Submit for Approval</button>
                        <button class="btn btn-success submit-scorecard-btn" th:if="${scorecard.approvalStatus == scorecardWorkflow.rejectedBySupervisorStatus}" type="button" onclick="submitScorecardForApproval()"
                                th:text="${approvalStatusActionLabels != null and scorecard.approvalStatus != null and approvalStatusActionLabels[#strings.toUpperCase(scorecard.approvalStatus)] != null ? approvalStatusActionLabels[#strings.toUpperCase(scorecard.approvalStatus)] : 'Re-Submit for Approval'}">Re-Submit for Approval</button>
                    </div>
                    <div class="col-lg-8" th:if="${totalAllocatedWeight != 100.0}">
                        <a th:href="@{/scorecards}" class="btn btn-success" type="button">Save For Later</a>
                        <button class="btn btn-secondary" type="button" disabled
                                th:text="${approvalStatusActionLabels != null and scorecard.approvalStatus != null and approvalStatusActionLabels[#strings.toUpperCase(scorecard.approvalStatus)] != null ? approvalStatusActionLabels[#strings.toUpperCase(scorecard.approvalStatus)] : 'Submit for Approval'}">Submit for Approval</button>
                    </div>
                </div>

                <form th:action="@{/scorecards/submit-scorecard-for-approval}" id="scorecardForm" method="post" th:object="${scorecard}">
                    <input type="hidden" name="id" th:value="${id}">
                </form>
            </div>

        </div>
        <div th:replace="fragments/template :: footer"></div>

    </div>
</div>

        th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>

        th:src="@{/js/plugins/select2/select2.full.min.js}"></script>

<script>

    $(document).ready(function(){
        $('.select2_demo_1').select2({

        });
    })
    $(document).ready(function(){
        $('.myselect').select2({
            tags: true
        });
    })
    $(document).on('select2:open', () => {
        document.querySelector('.select2-search__field').focus();
    });

    document.addEventListener('DOMContentLoaded', function () {
        var forms = document.querySelectorAll('form');
        forms.forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (form.dataset.submitting === 'true') {
                    event.preventDefault();
                    return;
                }
                lockSubmittingForm(form, 'Saving...');
            });
        });
    });
</script>
