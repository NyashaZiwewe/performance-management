<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<body>
<div th:fragment="readonly"
     th:if="${trainingNeedsPips != null and !#lists.isEmpty(trainingNeedsPips)}"
     class="self-assessment-pip-panel accordion"
     th:id="${trainingNeedsAccordionId}">
    <div class="self-assessment-pip-card">
        <div class="self-assessment-pip-header" th:id="${trainingNeedsHeadingId}">
            <button type="button"
                    class="btn btn-link self-assessment-pip-toggle collapsed"
                    data-toggle="collapse"
                    th:data-target="${'#' + trainingNeedsCollapseId}"
                    aria-expanded="false"
                    th:attr="aria-controls=${trainingNeedsCollapseId}">
                <span class="self-assessment-pip-title">
                    <i class="fa fa-graduation-cap"></i>
                    Training Needs / PIP
                </span>
                <span class="self-assessment-pip-count"
                      th:text="${#lists.size(trainingNeedsPips) + ' saved'}">0 saved</span>
                <i class="fa fa-chevron-down self-assessment-pip-chevron"></i>
            </button>
        </div>
        <div th:id="${trainingNeedsCollapseId}"
             class="collapse"
             th:attr="aria-labelledby=${trainingNeedsHeadingId},data-parent=${'#' + trainingNeedsAccordionId}">
            <div class="self-assessment-pip-body">
                <div class="table-responsive">
                    <table class="table table-sm self-assessment-pip-table">
                        <thead>
                        <tr>
                            <th>Target</th>
                            <th>Development Area</th>
                            <th>Identified Gap</th>
                            <th>Expected Outcome</th>
                            <th>Intervention</th>
                            <th>Support Required</th>
                            <th>Target Date</th>
                            <th>N/A</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pip : ${trainingNeedsPips}">
                            <td>
                                <div class="self-assessment-pip-text"
                                     th:text="${pip.target != null ? pip.target.measure : 'No linked target'}"></div>
                            </td>
                            <td><div class="self-assessment-pip-text" th:text="${pip.targetArea}"></div></td>
                            <td><div class="self-assessment-pip-text" th:text="${pip.concern}"></div></td>
                            <td><div class="self-assessment-pip-text" th:text="${pip.expectedStandard}"></div></td>
                            <td><div class="self-assessment-pip-text" th:text="${pip.agreedAction}"></div></td>
                            <td><div class="self-assessment-pip-text" th:text="${pip.requiredSupport}"></div></td>
                            <td><div class="self-assessment-pip-text" th:text="${pip.endDate == null ? '' : pip.endDate}"></div></td>
                            <td class="self-assessment-pip-na-cell">
                                <div class="self-assessment-pip-text" th:text="${pip.notApplicable ? 'Yes' : 'No'}"></div>
                            </td>
                            <td><div class="self-assessment-pip-text" th:text="${pip.status}"></div></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
