<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Management</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet" th:href="@{/font-awesome/css/font-awesome.css}">
    <link href="../../../static/css/animate.css" rel="stylesheet" th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
    <link href="../../../static/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="fixed-nav">
<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>
    <div id="page-wrapper" class="gray-bg">
        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">
            <div class="ibox-content m-b-sm border-bottom">
                <form th:action="@{/system-settings/save}" method="post" th:object="${settingsWrapper}">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>System Name</label>
                                <input type="text" class="form-control" th:field="*{systemName}" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Company Name</label>
                                <input type="text" class="form-control" th:field="*{companyName}" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Company Logo Filename</label>
                                <input type="text" class="form-control" th:field="*{companyLogo}" placeholder="zimlogo.png">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Host URL</label>
                                <input type="text" class="form-control" th:field="*{hostUrl}" placeholder="https://pm.example.com">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>HR Email</label>
                                <input type="email" class="form-control" th:field="*{hrEmail}">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Admin Email</label>
                                <input type="email" class="form-control" th:field="*{adminEmail}">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Bootstrap Admin</label>
                                <select class="form-control" th:field="*{bootstrapAdminEnabled}">
                                    <option th:value="true">Enabled</option>
                                    <option th:value="false">Disabled</option>
                                </select>
                                <small class="form-text text-muted">
                                    The hardcoded setup login works only while this is enabled.
                                </small>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Mail Sender Name</label>
                                <input type="text" class="form-control" th:field="*{mailFromName}">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Mail Sender Email</label>
                                <input type="email" class="form-control" th:field="*{mailFromEmail}">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>SMTP Host</label>
                                <input type="text" class="form-control" th:field="*{mailHost}" placeholder="smtp.office365.com">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>SMTP Port</label>
                                <input type="text" class="form-control" th:field="*{mailPort}" placeholder="587">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>SMTP Username</label>
                                <input type="text" class="form-control" th:field="*{mailUsername}">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>SMTP Password</label>
                                <input type="password" class="form-control" th:field="*{mailPassword}" placeholder="******">
                                <small class="form-text text-muted" th:if="*{mailPasswordConfigured}">
                                    A password is already stored. Leave blank to keep the current password.
                                </small>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-success" type="submit">Save Settings</button>
                </form>
            </div>
        </div>

        <div th:replace="fragments/template :: footer"></div>
    </div>
</div>

<script src="../../../static/js/jquery-3.6.0.min.js" th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js" th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js" th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js" th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/inspinia.js" th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js" th:src="@{/js/plugins/pace/pace.min.js}"></script>
</body>
</html>
