<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Performance Management</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet"
          th:href="@{/font-awesome/css/font-awesome.css}">

    <link href="../../../static/css/animate.css" rel="stylesheet"
          th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet"
          th:href="@{/css/style.css}">
    <link href="/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">

    <link href="../../../static/css/plugins/select2/select2.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2.min.css}">
    <link href="../../../static/css/plugins/select2/select2-bootstrap4.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2-bootstrap4.min.css}">
    <link href="../../../static/css/plugins/dataTables/datatables.min.css" rel="stylesheet"
          th:href="@{/css/plugins/dataTables/datatables.min.css}">

    <style>
        .hr{
            border-top: 4px solid #d6d6d4 !important;
        }

        .plan-capture-modal .modal-content {
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.18);
        }

        .plan-capture-modal .modal-header {
            background: #f7f9fb;
            border-bottom: 1px solid #e2e8f0;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .plan-capture-modal .modal-title {
            color: #0f172a;
            font-weight: 600;
        }

        .plan-capture-modal .table {
            margin-bottom: 10px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .plan-capture-modal .table th {
            color: #475569;
            font-weight: 600;
            width: 20%;
            border-top: 0;
        }

        .plan-capture-modal .table td {
            color: #0f172a;
            border-top: 0;
        }

        .plan-capture-modal .pm-work-columns {
            display: flex;
            flex-wrap: wrap;
        }

        .plan-capture-modal .pm-work-columns > div {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
        }

        .plan-capture-modal .pm-section-title {
            color: #0f172a !important;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .plan-capture-modal .todo-list {
            margin: 0 0 10px;
            padding-left: 0;
        }

        .plan-capture-modal .pm-row-card {
            align-items: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            display: flex;
            gap: 10px;
            padding: 8px 10px;
        }

        .plan-capture-modal .pm-row-input {
            list-style: none;
            padding: 0;
        }

        .plan-capture-modal .pm-row-input .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-shadow: none;
            height: 36px;
        }

        .plan-capture-modal input[type="checkbox"].pm-check {
            -webkit-appearance: none;
            appearance: none;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            display: inline-grid;
            flex: 0 0 18px;
            height: 18px;
            margin: 0;
            place-content: center;
            width: 18px;
        }

        .plan-capture-modal input[type="checkbox"].pm-check::after {
            color: #ffffff;
            content: "\2713";
            font-size: 11px;
            line-height: 1;
            opacity: 0;
            transform: scale(0.7);
            transition: 120ms transform ease-in-out, 120ms opacity ease-in-out;
        }

        .plan-capture-modal input[type="checkbox"].pm-check:checked {
            background: #2563eb;
            border-color: #2563eb;
        }

        .plan-capture-modal input[type="checkbox"].pm-check:checked::after {
            opacity: 1;
            transform: scale(1);
        }

        .plan-capture-modal .pm-progress-meta {
            align-items: center;
            display: flex;
            font-size: 12px;
            font-weight: 600;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .plan-capture-modal .pm-progress-track {
            background: #e2e8f0;
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
        }

        .plan-capture-modal .pm-progress-fill {
            background: linear-gradient(90deg, #1d4ed8, #3b82f6);
            border-radius: 999px;
            height: 100%;
            transition: width 220ms ease;
        }

        .plan-capture-modal .pm-status-chip {
            background: #e2e8f0;
            border-radius: 999px;
            color: #0f172a;
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            text-transform: capitalize;
        }

        .plan-capture-modal .label {
            border-radius: 999px;
            font-size: 10px;
            letter-spacing: 0;
            padding: 3px 8px;
            text-transform: uppercase;
        }

        .plan-capture-modal .m-l-xs {
            flex: 1;
            margin-left: 0;
        }

        .plan-capture-modal textarea.form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            min-height: 104px;
        }

        .completed {
            position: relative;
        }
        .completed::after {
            border-bottom: 0.2em solid green;
            content: "";
            left: 0;
            position: absolute;
            right: 0;
            top: 50%;
        }
    </style>
</head>

<body class="fixed-nav">

<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>

    <div id="page-wrapper" class="gray-bg">

        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">

            <div class="row">
                <div class="col-lg-4">
                    <div class="ibox">
                        <div class="ibox-content">
                            <h3>To-do</h3>
                            <p class="small"><i class="fa fa-hand-o-up"></i> Drag task between list</p>

                            <div class="input-group">
                                <input type="text" id="newPerformanceImprovementPlan" placeholder="Add new Performance Improvement Plan. " class="input form-control-sm form-control">
                                <span class="input-group-append" onclick="savePerformanceImprovementPlan()">
                                        <button type="button" class="btn btn-sm btn-white"> <i class="fa fa-plus"></i> Add task</button>
                                </span>
                            </div>

                            <ul class="sortable-list connectList agile-list" id="todo">
                                <th:block th:each="plan : ${plansList.?[#this.status eq 'todo']}">
                                    <th:block th:replace="performance-improvement-plan/fragments/pipBoardFragments :: planCard(${plan}, 'secondary-element')"></th:block>
                                </th:block>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="ibox">
                        <div class="ibox-content">
                            <h3>In Progress</h3>

                            <ul class="sortable-list connectList agile-list" id="inprogress">
                                <th:block th:each="plan : ${plansList.?[#this.status eq 'inprogress']}">
                                    <th:block th:replace="performance-improvement-plan/fragments/pipBoardFragments :: planCard(${plan}, 'warning-element')"></th:block>
                                </th:block>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="ibox">
                        <div class="ibox-content">
                            <h3>Completed</h3>

                            <ul class="sortable-list connectList agile-list" id="completed">
                                <th:block th:each="plan : ${plansList.?[#this.status eq 'completed']}">
                                    <th:block th:replace="performance-improvement-plan/fragments/pipBoardFragments :: planCard(${plan}, 'success-element')"></th:block>
                                </th:block>
                            </ul>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <div th:replace="fragments/template :: footer"></div>

    </div>
</div>


<!-- Mainly scripts -->
<script src="../../../static/js/jquery-3.6.0.min.js"
        th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js"
        th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js"
        th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js"
        th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/plugins/select2/select2.full.min.js"
        th:src="@{/js/plugins/select2/select2.full.min.js}"></script>

<!-- Custom and plugin javascript -->
<script src="../../../static/js/inspinia.js"
        th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js"
        th:src="@{/js/plugins/pace/pace.min.js}"></script>
<script src="../../../static/js/plugins/jquery-ui/jquery-ui.min.js"
        th:src="@{/js/plugins/jquery-ui/jquery-ui.min.js}"></script>

<script>
    $(document).ready(function(){

        $("#todo, #inprogress, #completed").sortable({
            connectWith: ".connectList",
            update: function( event, ui ) {

                let todo = $( "#todo" ).sortable( "toArray" );
                let inprogress = $( "#inprogress" ).sortable( "toArray" );
                let completed = $( "#completed" ).sortable( "toArray" );
                $('.output').html("ToDo: " + window.JSON.stringify(todo) + "<br/>" + "In Progress: " + window.JSON.stringify(inprogress) + "<br/>" + "Completed: " + window.JSON.stringify(completed));
            }
        }).disableSelection();

        enhancePlanCaptureModals();

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const plan = urlParams.get('plan');

        if(plan != null){
            $('#planModal'+ plan).modal('show');
        }

    });

    function updatePerformanceImprovementPlanStatus(id, status){
        $.ajax({
            url : '/performance-improvement-plans/update-performance-improvement-plan-status',
            method: "POST",
            data: {
                id, status
            },
            success: function () {},
            error : function(data) {

            }
        });
    }

    function savePerformanceImprovementPlan(){

        let plan = document.getElementById("newPerformanceImprovementPlan").value;

        $.ajax({
            url : '/performance-improvement-plans/save-performance-improvement-plan',
            method: "POST",
            data: {
                plan
            },
            success: function (data) {
                window.location.reload();
            },
            error : function(data) {

            }
        });
    }

    function escapeHtml(value){
        return $("<div>").text(value || "").html();
    }

    function formatProgress(progress){
        const value = Number(progress || 0);
        return (Math.round(value * 10) / 10).toFixed(1).replace(".0", "");
    }

    function normalizePlanStatus(status){
        return (status || "").toString().toLowerCase().replace(/[\s_-]/g, "");
    }

    function friendlyPlanStatus(status){
        const normalizedStatus = normalizePlanStatus(status);
        if(normalizedStatus === "inprogress"){
            return "In Progress";
        }
        if(normalizedStatus === "completed"){
            return "Completed";
        }
        return "To-do";
    }

    function enhancePlanCaptureModals(){
        $(".plan-capture-modal").each(function () {
            const $modal = $(this);
            const modalId = $modal.attr("id") || "";
            const planId = modalId.replace("planModal", "");
            if(!planId){
                return;
            }

            $modal.find("h4").addClass("pm-section-title");
            $modal.find(".todo-list li").has("input[type='checkbox']").addClass("pm-row-card");
            $modal.find(".todo-list li").has("input.form-control").addClass("pm-row-input");
            $modal.find(".todo-list input[type='checkbox']").addClass("pm-check").css("zoom", "");

            const $statusCell = $modal.find("th").filter(function(){
                return $(this).text().trim() === "Status:";
            }).first().next("td");
            if($statusCell.length){
                $statusCell.attr("id", "planStatus" + planId);
                $statusCell.addClass("pm-status-chip");
                $statusCell.text(friendlyPlanStatus($statusCell.text()));
            }

            const $progressCell = $modal.find("th").filter(function(){
                return $(this).text().trim() === "Progress:";
            }).first().next("td");
            if($progressCell.length){
                const currentProgress = parseFloat($progressCell.text()) || 0;
                $progressCell.html(
                    '<div class="pm-progress-meta">' +
                        '<span id="planProgressText' + planId + '">' + formatProgress(currentProgress) + '% complete</span>' +
                        '<span id="taskCounter' + planId + '"></span>' +
                    '</div>' +
                    '<div class="pm-progress-track">' +
                        '<div id="planProgressBar' + planId + '" class="pm-progress-fill" style="width:' + currentProgress + '%;"></div>' +
                    '</div>'
                );
            }

            const totalTasks = $modal.find("small[id^='taskLabel']").length;
            const completedTasks = $modal.find("small[id^='taskLabel'].label-primary").length;
            const currentProgressText = $("#planProgressText" + planId).text();
            const progressValue = parseFloat(currentProgressText) || 0;
            updatePlanProgressUI(planId, progressValue, $("#planStatus" + planId).text(), completedTasks, totalTasks);
        });
    }

    function updateBoardCardStatus(planId, status){
        const normalizedStatus = normalizePlanStatus(status);
        const $card = $("li[id='" + planId + "']");
        if(!$card.length){
            return;
        }

        let targetColumnId = "todo";
        let cardClass = "secondary-element";
        if(normalizedStatus === "completed"){
            targetColumnId = "completed";
            cardClass = "success-element";
        } else if (normalizedStatus === "inprogress"){
            targetColumnId = "inprogress";
            cardClass = "warning-element";
        }

        const $targetColumn = $("#" + targetColumnId);
        if($targetColumn.length && $card.parent().attr("id") !== targetColumnId){
            $targetColumn.append($card);
        }
        $card.removeClass("secondary-element warning-element success-element").addClass(cardClass);
    }

    function updatePlanProgressUI(planId, progress, status, completedTasks, totalTasks){
        if(planId == null){
            return;
        }
        const safeProgress = Math.max(0, Math.min(100, Number(progress || 0)));
        $("#planProgressText" + planId).text(formatProgress(safeProgress) + "% complete");
        $("#planProgressBar" + planId).css("width", safeProgress + "%");
        $("#planStatus" + planId).text(friendlyPlanStatus(status));

        if(Number.isFinite(Number(totalTasks)) && Number.isFinite(Number(completedTasks))){
            $("#taskCounter" + planId).text(completedTasks + "/" + totalTasks + " tasks done");
        }

        updateBoardCardStatus(planId, status);
    }

    function appendTaskRow(performanceImprovementPlanId, taskData){
        const taskInput = $("#newTask" + performanceImprovementPlanId);
        if(!taskInput.length){
            return;
        }

        const newTaskHtml =
            '<ul class="todo-list small-list m-t">' +
            '<li class="pm-row-card">' +
            '<input id="' + taskData.id + '" class="pm-check" type="checkbox" onchange="updateTaskStatus(this.id)">' +
            '<span id="taskName' + taskData.id + '" class="m-l-xs">' + escapeHtml(taskData.name) + '</span>' +
            '<small id="taskLabel' + taskData.id + '" class="label label-warning">pending</small>' +
            '</li>' +
            '</ul>';
        taskInput.closest("ul").before(newTaskHtml);
    }

    function appendIssueRow(performanceImprovementPlanId, issueData){
        const issueInput = $("#newIssue" + performanceImprovementPlanId);
        if(!issueInput.length){
            return;
        }

        const newIssueHtml =
            '<ul class="todo-list small-list m-t">' +
            '<li class="pm-row-card">' +
            '<input id="' + issueData.id + '" class="pm-check" type="checkbox" onchange="updateIssueStatus(this.id)">' +
            '<span id="issueName' + issueData.id + '" class="m-l-xs">' + escapeHtml(issueData.name) + '</span>' +
            '<small id="issueLabel' + issueData.id + '" class="label label-warning">pending</small>' +
            '</li>' +
            '</ul>';
        issueInput.closest("ul").before(newIssueHtml);
    }

    function appendCommentRow(performanceImprovementPlanId, comment){
        const noteInput = $("#comment" + performanceImprovementPlanId);
        const commentsList = noteInput.closest(".pip-comments-column").find("ul.todo-list").first();
        if(!commentsList.length){
            return;
        }
        const now = new Date().toLocaleDateString();
        commentsList.append("<li>" + escapeHtml(comment) + " [" + escapeHtml(now) + "]</li>");
    }

    function saveTask(performanceImprovementPlanId){

        const taskInput = document.getElementById("newTask" + performanceImprovementPlanId);
        let task = taskInput.value.trim();
        if(task === ""){
            return;
        }

        $.ajax({
            url : '/performance-improvement-plans/save-task',
            method: "POST",
            dataType: "json",
            data: {
                performanceImprovementPlanId, task
            },
            success: function (data) {
                if(!data.saved){
                    alert(data.message || "Failed to create task.");
                    return;
                }
                appendTaskRow(performanceImprovementPlanId, data);
                updatePlanProgressUI(data.planId, data.planProgress, data.planStatus, data.completedTasks, data.totalTasks);
                taskInput.value = "";
            },
            error : function() {
                alert("Failed to create task.");
            }
        });
    }

    function saveIssue(performanceImprovementPlanId){

        const issueInput = document.getElementById("newIssue"+ performanceImprovementPlanId);
        let issue = issueInput.value.trim();
        if(issue === ""){
            return;
        }

        $.ajax({
            url : '/performance-improvement-plans/save-issue',
            method: "POST",
            dataType: "json",
            data: {
                performanceImprovementPlanId, issue
            },
            success: function (data) {
                if(!data.saved){
                    alert(data.message || "Failed to create issue.");
                    return;
                }
                appendIssueRow(performanceImprovementPlanId, data);
                issueInput.value = "";
            },
            error : function() {
                alert("Failed to create issue.");
            }
        });
    }

    function saveNote(performanceImprovementPlanId){

        const noteInput = document.getElementById("comment"+ performanceImprovementPlanId);
        let note = noteInput.value.trim();
        if(note === ""){
            return;
        }

        $.ajax({
            url : '/performance-improvement-plans/save-note',
            method: "POST",
            dataType: "json",
            data: {
                performanceImprovementPlanId, note
            },
            success: function (data) {
                if(!data.saved){
                    alert(data.message || "Failed to post comment.");
                    return;
                }
                appendCommentRow(performanceImprovementPlanId, data.comment);
                noteInput.value = "";
            },
            error : function() {
                alert("Failed to post comment.");
            }
        });
    }


    function updateTaskStatus(taskId){
        $.ajax({
            url : '/performance-improvement-plans/update-task-status',
            method: "POST",
            dataType: "json",
            data: {
                taskId
            },
            success: function (data) {
                if(data.status === "COMPLETED"){
                    document.getElementById("taskName"+ taskId).classList.add("completed");
                    document.getElementById("taskLabel"+ taskId).classList.replace("label-warning","label-primary");
                    document.getElementById("taskLabel"+ taskId).innerText="completed";
                }else{
                    document.getElementById("taskName"+ taskId).classList.remove("completed");
                    document.getElementById("taskLabel"+ taskId).classList.replace("label-primary","label-warning");
                    document.getElementById("taskLabel"+ taskId).innerText="pending";
                }
                updatePlanProgressUI(data.planId, data.planProgress, data.planStatus, data.completedTasks, data.totalTasks);
            },
            error : function(data) {

            }
        });
    }

    function updateIssueStatus(issueId){

        $.ajax({
            url : '/performance-improvement-plans/update-issue-status',
            method: "POST",
            dataType: "json",
            data: {
                issueId
            },
            success: function (data) {
                if(data.status === "TODO"){
                    document.getElementById("issueName"+ issueId).classList.remove("completed");
                    document.getElementById("issueLabel"+ issueId).classList.replace("label-primary","label-warning");
                    document.getElementById("issueLabel"+ issueId).innerText="pending";
                }else if(data.status ==="COMPLETED"){
                    document.getElementById("issueName"+ issueId).classList.add("completed");
                    document.getElementById("issueLabel"+ issueId).classList.replace("label-warning","label-primary");
                    document.getElementById("issueLabel"+ issueId).innerText="completed";

                }else{
                    document.getElementById("issueName"+ issueId).classList.remove("completed");
                    document.getElementById("issueLabel"+ issueId).classList.replace("label-primary","label-warning");
                    document.getElementById("issueLabel"+ issueId).innerText="pending";
                }
            },
            error : function(data) {

            }
        });
    }

</script>

</body>

</html>
