<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisions</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet" th:href="@{/font-awesome/css/font-awesome.css}">
    <link href="../../../static/css/animate.css" rel="stylesheet" th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
    <link href="/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="fixed-nav">
<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>

    <div id="page-wrapper" class="gray-bg">
        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5>Divisions</h5>
                            <div class="ibox-tools">
                                <a th:if="${canManageDivisions}" data-toggle="modal" data-target="#addDivisionModal">
                                    <button class="btn btn-success btn-sm" title="Add Division" type="button">
                                        <i class="fa fa-plus-square"></i>
                                    </button>
                                </a>
                            </div>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Code</th>
                                        <th>Address</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Website</th>
                                        <th>Color Code</th>
                                        <th th:if="${canManageDivisions}">Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="division : ${divisions}">
                                        <td th:text="${division.name}"></td>
                                        <td th:text="${division.code}"></td>
                                        <td th:text="${division.address}"></td>
                                        <td th:text="${division.email}"></td>
                                        <td th:text="${division.phone}"></td>
                                        <td th:text="${division.website}"></td>
                                        <td th:text="${division.colorCode}"></td>
                                        <td th:if="${canManageDivisions}">
                                            <a data-toggle="modal" th:data-target="'#editDivisionModal' + ${division.id}">
                                                <button class="btn btn-success btn-sm" title="Edit" type="button">
                                                    <i class="fa fa-pencil-square" aria-hidden="true"></i>
                                                </button>
                                            </a>
                                            <a data-toggle="modal" th:data-target="'#deleteDivisionModal' + ${division.id}">
                                                <button class="btn btn-danger btn-sm" title="Delete" type="button">
                                                    <i class="fa fa-trash" aria-hidden="true"></i>
                                                </button>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(divisions)}">
                                        <td th:colspan="${canManageDivisions ? 8 : 7}">No divisions found.</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="fragments/template :: footer"></div>
    </div>
</div>

<div class="modal fade" id="addDivisionModal" tabindex="-1" role="dialog" aria-hidden="true" th:if="${canManageDivisions}">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Division</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form th:action="@{/divisions/save-division}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Code</label>
                        <input type="text" name="code" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" name="address" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="phone" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Website</label>
                        <input type="text" name="website" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Color Code</label>
                        <input type="text" name="colorCode" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-warning" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:each="division : ${divisions}" th:if="${canManageDivisions}">
    <div class="modal fade" th:id="'editDivisionModal' + ${division.id}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Division</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{/divisions/update-division}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="id" th:value="${division.id}">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" class="form-control" th:value="${division.name}" required>
                        </div>
                        <div class="form-group">
                            <label>Code</label>
                            <input type="text" name="code" class="form-control" th:value="${division.code}">
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" name="address" class="form-control" th:value="${division.address}">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" th:value="${division.email}">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" name="phone" class="form-control" th:value="${division.phone}">
                        </div>
                        <div class="form-group">
                            <label>Website</label>
                            <input type="text" name="website" class="form-control" th:value="${division.website}">
                        </div>
                        <div class="form-group">
                            <label>Color Code</label>
                            <input type="text" name="colorCode" class="form-control" th:value="${division.colorCode}">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-warning" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" th:id="'deleteDivisionModal' + ${division.id}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Division</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{/divisions/delete-division}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="id" th:value="${division.id}">
                        <p class="text-danger">Delete this division?</p>
                        <p th:text="${division.name}"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-warning" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="../../../static/js/jquery-3.6.0.min.js" th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js" th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js" th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js" th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/inspinia.js" th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js" th:src="@{/js/plugins/pace/pace.min.js}"></script>
</body>
</html>
