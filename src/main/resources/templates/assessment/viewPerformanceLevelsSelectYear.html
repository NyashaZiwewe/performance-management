<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Performance Management</title>

    <link href="../../../static/css/bootstrap.min.css" rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
    <link href="../../../static/font-awesome/css/font-awesome.css" rel="stylesheet"
          th:href="@{/font-awesome/css/font-awesome.css}">

    <link href="../../../static/css/animate.css" rel="stylesheet"
          th:href="@{/css/animate.css}">
    <link href="../../../static/css/style.css" rel="stylesheet"
          th:href="@{/css/style.css}">
    <link href="/css/custom.css" rel="stylesheet" th:href="@{/css/custom.css}">

    <link href="../../../static/css/plugins/select2/select2.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2.min.css}">
    <link href="../../../static/css/plugins/select2/select2-bootstrap4.min.css" rel="stylesheet"
          th:href="@{/css/plugins/select2/select2-bootstrap4.min.css}">
    <link href="../../../css/plugins/dualListbox/bootstrap-duallistbox.min.css"
          th:href="@{/css/plugins/dualListbox/bootstrap-duallistbox.min.css}"rel="stylesheet">


</head>

<body class="fixed-nav">

<div id="wrapper">
    <div th:replace="fragments/template :: side-menu"></div>

    <div id="page-wrapper" class="gray-bg">

        <div th:replace="fragments/template :: top-navbar"></div>
        <div th:replace="fragments/template :: page-heading"></div>
        <div th:replace="fragments/template :: alerts"></div>

        <div class="wrapper wrapper-content animated fadeInRight ecommerce">
            <div class="ibox-content m-b-sm border-bottom col-10">
                <form id="performanceLevelSelectionForm" th:action="@{/performance-review/view-performance-levels}" method="post">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="form-group row">
                                <label class="col-form-label col-lg-4">From Reporting Date</label>
                                <div class="col-lg-8">
                                    <select id="fromReportingDateId" name="fromReportingDateId" class="form-control" required>
                                        <option th:each="dateOption : ${performanceLevelReportingDateOptions}"
                                                th:value="${dateOption.id}"
                                                th:attr="data-date=${dateOption.dateValue}"
                                                th:text="${dateOption.label}"
                                                th:selected="${selectedFromReportingDateId != null and selectedFromReportingDateId == dateOption.id}">
                                            Reporting Date
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-lg-4">To Reporting Date</label>
                                <div class="col-lg-8">
                                    <select id="toReportingDateId" name="toReportingDateId" class="form-control" required>
                                        <option th:each="dateOption : ${performanceLevelReportingDateOptions}"
                                                th:value="${dateOption.id}"
                                                th:attr="data-date=${dateOption.dateValue}"
                                                th:text="${dateOption.label}"
                                                th:selected="${selectedToReportingDateId != null and selectedToReportingDateId == dateOption.id}">
                                            Reporting Date
                                        </option>
                                    </select>
                                    <small class="form-text text-muted">From date cannot be greater than To date.</small>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-lg-4">Employees</label>
                                <div class="col-lg-8">
                                    <select class="form-control dual_select" multiple size="20" name="employeeIds">
                                        <option th:each="account : ${accountsList}"
                                                th:value="${account.id}"
                                                th:selected="${selectedEmployeeIds != null and selectedEmployeeIds.contains(account.id)}"
                                                th:text="${account.fullName + '___' + (account.department == null ? 'No Department' : account.department.name) + '_' + account.accountType + '_' + account.position}">
                                            Employee
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group row">
                        <div class="col-lg-4">

                        </div>
                        <div class="col-lg-8">
                                <a th:href="@{/}" class="btn btn-warning">Cancel</a>

                            <button class="btn btn-success" type="submit">View Graph</button>
                        </div>
                    </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div th:replace="fragments/template :: footer"></div>

    </div>
</div>

<!-- Mainly scripts -->
<script src="../../../static/js/jquery-3.6.0.min.js"
        th:src="@{/js/jquery-3.6.0.min.js}"></script>
<script src="../../../static/js/popper.min.js"
        th:src="@{/js/popper.min.js}"></script>
<script src="../../../static./js/bootstrap.js"
        th:src="@{/js/bootstrap.js}"></script>
<script src="../../../static/js/plugins/metisMenu/jquery.metisMenu.js"
        th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script src="../../../static/js/plugins/select2/select2.full.min.js"
        th:src="@{/js/plugins/select2/select2.full.min.js}"></script>


<!-- Custom and plugin javascript -->
<script src="../../../static/js/inspinia.js"
        th:src="@{/js/inspinia.js}"></script>
<script src="../../../static/js/plugins/pace/pace.min.js"
        th:src="@{/js/plugins/pace/pace.min.js}"></script>
<script src="../../../js/plugins/dualListbox/jquery.bootstrap-duallistbox.js"
        th:src="@{/js/plugins/dualListbox/jquery.bootstrap-duallistbox.js}"></script>

<script>

    $(document).ready(function () {
        $('.select2_demo_1').select2({});
        $('#submit-btn').prop('disabled', true);
    })

    $(document).ready(function () {
        $('.myselect').select2({
            tags: true
        });
    })
    $(document).on('select2:open', () => {
        document.querySelector('.select2-search__field').focus();
    });

    $('.dual_select').bootstrapDualListbox({
        selectorMinimalHeight: 160
    });

    $('#performanceLevelSelectionForm').on('submit', function (event) {
        const fromDate = $('#fromReportingDateId option:selected').data('date');
        const toDate = $('#toReportingDateId option:selected').data('date');
        if (fromDate && toDate && fromDate > toDate) {
            event.preventDefault();
            alert('From date cannot be greater than To date.');
        }
    });

</script>



</body>

</html>
