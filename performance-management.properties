# ======================================================================
# Performance Management - External Secrets and Deployment Configuration
# Store this file on the server at:
# /data/secrets/performance-management/performance-management.properties
# ======================================================================

# Server
server.port=9001
server.address=
server.servlet.session.timeout=20m

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/performance_management?useSSL=false
spring.datasource.username=
spring.datasource.password=

# Uploads
spring.servlet.multipart.location=/data/pmdocuments/

# Mail
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=

# App links and notification routing
host.url=
email.hr=
email.admin=

# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework=WARN
logging.file.name=/data/logs/performance-management.log
logging.file.path=/data/logs

# Optional integrations
twilio.accountSid=
twilio.authToken=
twilio.whatsapp.from=
openai.api.key=
openai.api.url=https://api.openai.com/v1/chat/completions

# Bootstrap admin (initial setup only)
BOOTSTRAP_ADMIN_EMAIL=
BOOTSTRAP_ADMIN_PASSWORD=
